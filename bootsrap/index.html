<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Project Dashboard</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        section {
            width: 90%;
            max-width: 1100px;
            margin: 60px auto;
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header i {
            font-size: 55px;
            color: #7952b3;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 17px;
        }

        /* Cards Container */

        .projects {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* Card */

        .project-card {
            width: 300px;

            background: #1e293b;

            padding: 30px;

            border-radius: 18px;

            border: 1px solid #334155;

            text-align: center;

            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-8px);

            border-color: #7952b3;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Icon */

        .icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #0f172a;

            border-radius: 50%;

            color: #a78bfa;

            font-size: 28px;
        }

        .project-card h2 {
            font-size: 23px;

            margin-bottom: 10px;
        }

        .project-card p {
            color: #94a3b8;

            font-size: 14px;

            margin-bottom: 20px;
        }

        /* Button */

        .project-card a {
            display: inline-block;

            text-decoration: none;

            background: #7952b3;

            color: white;

            padding: 11px 22px;

            border-radius: 8px;

            font-size: 15px;

            transition: 0.3s;
        }

        .project-card a:hover {
            background: #a78bfa;

            color: #0f172a;
        }

        /* Footer */

        footer {
            text-align: center;

            margin-top: 50px;

            color: #64748b;

            font-size: 14px;
        }

        /* Mobile */

        @media (max-width: 500px) {

            section {
                width: 90%;

                margin: 40px auto;
            }

            .header h1 {
                font-size: 28px;
            }

            .project-card {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <section>


        <!-- Header -->

        <div class="header">

            <i class="fa-brands fa-bootstrap"></i>

            <h1>Welcome to My Bootstrap Project</h1>

            <p>Explore my Bootstrap projects day by day</p>

        </div>


        <!-- Projects -->

        <div class="projects">


            <!-- Day 1 -->

            <div class="project-card">

                <div class="icon">
                    <i class="fa-brands fa-bootstrap"></i>
                </div>

                <h2>Day 1</h2>

                <p>Bootstrap Basics and Components</p>

                <a href="file:///D:/Front_End/bootsrap/Day1/index.html">

                    Open Project
                    <i class="fa-solid fa-arrow-right"></i>

                </a>

            </div>


            <!-- Day 2 -->

            <div class="project-card">

                <div class="icon">
                    <i class="fa-solid fa-laptop-code"></i>
                </div>

                <h2>Day 2</h2>

                <p>Bootstrap Layout and Responsive Design</p>

                <a href="file:///D:/Front_End/bootsrap/Day2/index.html">

                    Open Project
                    <i class="fa-solid fa-arrow-right"></i>

                </a>

            </div>


        </div>


        <!-- Footer -->

        <footer>

            <p>
                <i class="fa-brands fa-bootstrap"></i>
                My Bootstrap Learning Projects • 2026
            </p>

        </footer>


    </section>

</body>

</html>
