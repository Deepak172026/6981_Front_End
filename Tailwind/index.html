<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailwind Project Dashboard</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        section {
            width: 90%;
            max-width: 1100px;
            margin: 60px auto;
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header i {
            font-size: 55px;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 17px;
        }

        /* Cards */

        .days {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.day-card {
    width: 300px;
    background: #1e293b;
    padding: 30px;
    border-radius: 18px;
    border: 1px solid #334155;
    text-align: center;
    transition: 0.3s;
}

        .day-card:hover {
            transform: translateY(-8px);
            border-color: #38bdf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Icon */

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f172a;
            border-radius: 50%;

            color: #38bdf8;
            font-size: 28px;
        }

        .day-card h2 {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .day-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Button */

        .day-card a {
            text-decoration: none;
        }

        .day-card button {
            border: none;
            background: #2563eb;
            color: white;

            padding: 11px 22px;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s;
        }

        .day-card button:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        /* Footer */

        footer {
            text-align: center;
            margin-top: 50px;
            color: #64748b;
            font-size: 14px;
        }

        /* Tablet */

        @media (max-width: 800px) {

            .days {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* Mobile */

        @media (max-width: 500px) {

            section {
                width: 90%;
                margin: 40px auto;
            }

            .days {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>

    <section>

        <!-- Header -->

        <div class="header">

            <i class="fa-solid fa-wind"></i>

            <h1>Welcome to My Tailwind Project</h1>

            <p>Explore my Tailwind CSS projects day by day</p>

        </div>


        <!-- Project Cards -->

        <div class="days">


            <!-- Day 1 -->

            <div class="day-card">

                <div class="icon">
                    <i class="fa-solid fa-sun"></i>
                </div>

                <h2>Day 1</h2>

                <p>Dot & Key Product Website</p>

                <a href="file:///D:/Front_End/Tailwind/Day1/Dot_and_key/index.html">

                    <button>
                        Open Project
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </a>

            </div>


            <!-- Day 2 -->

            <div class="day-card">

                <div class="icon">
                    <i class="fa-solid fa-mug-hot"></i>
                </div>

                <h2>Day 2</h2>

                <p>Tea Shop Website</p>

                <a href="file:///D:/Front_End/Tailwind/Day2/Tea_shop/index.html">

                    <button>
                        Open Project
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </a>

            </div>


        </div>


        <!-- Footer -->

        <footer>

            <p>
                <i class="fa-solid fa-code"></i>
                My Tailwind CSS Learning Projects • 2026
            </p>

        </footer>

    </section>

</body>

</html>
